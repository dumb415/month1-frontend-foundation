<!DOCTYPE html> <!-- tells the browser "this is HTML5" — like #include at the top of a C file, sets the rules for everything below -->
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- character encoding, prevents weird symbol bugs -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes it render correctly on mobile -->
  <title>Day 4 - Grid Layout</title>
  <link rel="stylesheet" href="style.css"> <!-- links your CSS file — like #include "myheader.h" -->
</head>
<body>

  <div class="layout"> <!-- this div is the GRID CONTAINER — everything grid-related applies to this -->
    <header>HEADER</header>
    <nav>SIDEBAR</nav>
    <main>MAIN CONTENT</main>
    <footer>FOOTER</footer>
  </div>

</body>
</html>
