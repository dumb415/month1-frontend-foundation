<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Day 7 — Fetch API</title>
    <style>
        .post { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>Latest Posts</h1>
    <div id="posts"></div> <!-- JS will inject content here -->

    <script>
        async function loadPosts() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts");
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();    
                return data;
            } catch (error) {
                console.error("Failed to load posts:", error.message);
                return [];
            }
        }

        async function displayPosts() {
            const postsContainer = document.getElementById("posts");
            postsContainer.textContent = "Loading...";

            const posts = await loadPosts();

            if (posts.length === 0) {
                postsContainer.textContent = "Couldn't load posts. Try again later.";
                return;
            }

            const firstFive = posts.slice(0, 5);
            const postsHTML = firstFive
                .map(({ id, title, body }) => `
                    <article class="post" data-id="${id}">
                        <h3>${title}</h3>
                        <p>${body}</p>
                    </article>
                `)
                .join("");

            postsContainer.innerHTML = postsHTML;
        }

        displayPosts();
    </script>
</body>
</html>
